  }

    font-family:inherit;
    font-size:15px;
    text-align:center;
    border:1px solid #D8DCE3;
    border-radius:10px;
    background:#fff;
    color:var(--ink);
  }
  .field input::placeholder{color:#A6ACB8;}
  .field input:focus{
    outline:none;
    border-color:var(--blue-btn);
    background:#fff;
  }

    border-radius:10px;
    background:#fff;
    flex:none;
  }
